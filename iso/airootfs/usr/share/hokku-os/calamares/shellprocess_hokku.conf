# Runs in the installed system after CachyOS's shellprocess (which removes the
# live display-manager link and runs dmcheck, which doesn't handle greetd).
---
dontChroot: false
timeout: 60
script:
    - command: |
        cat > /etc/greetd/config.toml <<'TOML'
        [terminal]
        vt = 1

        [default_session]
        command = "tuigreet --time --remember --asterisks --cmd /usr/bin/hokku-session"
        user = "greeter"
        TOML
    - "ln -sf /usr/lib/systemd/system/greetd.service /etc/systemd/system/display-manager.service"
    - "-rm -f /usr/local/bin/hokku-installer /usr/share/applications/hokku-installer.desktop"
    - "-rm -rf /usr/share/hokku-os/calamares"

i18n:
    name: "Setting up the Hokku login screen..."
